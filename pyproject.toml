[project]
name = "srag-sentinel"
version = "0.1.0"
description = "Agentic AI system that generates SRAG outbreak reports from OpenDATASUS metrics and real-time news."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.8.1",
    "langgraph>=1.2.22",
    "matplotlib>=3.11.2",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "polars>=2.1.0",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "pyyaml>=6.0.3",
    "surrealdb>=3.0.0",
    "uvicorn[standard]>=0.54.0",
    "weasyprint>=70.0",
]

[project.scripts]
srag-sentinel = "srag_sentinel.cli:main"

[project.optional-dependencies]
google = [
    "langchain-google-genai>=4.5.0",
]
nvidia = [
    "langchain-nvidia-ai-endpoints>=1.5.0",
]
openrouter = [
    "langchain-openrouter>=0.2.9",
]
groq = [
    "langchain-groq>=1.2.0",
]
unsloth = [
    "langchain-openai>=1.8.0",
]
ollama = [
    "langchain-ollama>=1.1.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170",
    "mypy>=2.4",
    "pypdf>=7.1.0",
    "pytest>=9.2",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.0",
    "respx>=0.23.1",
    "ruff>=0.17",
    "types-defusedxml>=0.7.0.20260504",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
# Throwaway spike scripts and vendored third-party skills are not project code.
extend-exclude = ["spikes", ".claude"]

[tool.ruff.format]
# Docs are authored by hand; only Python source is auto-formatted.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90", "S", "N", "PL", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
# Build tooling shells out to Docker with fixed argument lists (never user input).
"scripts/**" = ["S603", "S607"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra -m 'not live and not integration'"
markers = [
    "integration: needs the SurrealDB container (docker compose up -d surrealdb)",
    "live: needs network access and/or provider API keys",
]

[tool.coverage.run]
source = ["srag_sentinel"]
branch = true

[tool.coverage.report]
show_missing = true
